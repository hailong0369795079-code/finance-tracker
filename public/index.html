<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Finance Dashboard Dark Theme</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    :root {
      --bg-main: #131722;
      --bg-card: #1e222d;
      --text-main: #d1d4dc;
      --text-muted: #787b86;
      --border: #2a2e39;
      --c-chi: #ef5350; /* Đỏ */
      --c-thu: #26a69a; /* Xanh ngọc */
      --c-dautu: #2962ff; /* Xanh dương */
    }
    
    * { box-sizing: border-box; }
    body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg-main); color: var(--text-main); margin: 0; padding: 20px; }
    
    .container { max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
    .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; padding: 20px; }
    
    h2 { margin-top: 0; font-size: 18px; color: var(--text-main); display: flex; align-items: center; justify-content: space-between; }
    
    /* Grid layout */
    .row-charts { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .row-data { display: grid; grid-template-columns: 1fr; gap: 20px; }

    /* Form thêm giao dịch nhanh */
    .form-group { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
    .form-group input, .form-group select, .form-group button {
      padding: 10px; background: var(--bg-main); border: 1px solid var(--border);
      color: var(--text-main); border-radius: 6px; font-size: 14px; outline: none;
    }
    .form-group input, .form-group select { flex: 1; min-width: 140px; }
    .form-group button { background: var(--c-thu); color: #fff; border: none; font-weight: bold; cursor: pointer; padding: 10px 20px; }
    .form-group button:hover { opacity: 0.9; }

    /* Bảng dữ liệu */
    .table-container { overflow-x: auto; max-height: 400px; }
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 14px; }
    th, td { padding: 12px; border-bottom: 1px solid var(--border); }
    th { color: var(--text-muted); font-weight: 600; background: rgba(255,255,255,0.02); }
    
    .badge { padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; }
    .badge.chi { background: rgba(239, 83, 80, 0.2); color: var(--c-chi); }
    .badge.thu { background: rgba(38, 166, 154, 0.2); color: var(--c-thu); }
    .badge.dautu { background: rgba(41, 98, 255, 0.2); color: var(--c-dautu); }

    .text-chi { color: var(--c-chi); font-weight: bold; }
    .text-thu { color: var(--c-thu); font-weight: bold; }
    
    .action-btn { background: none; border: none; cursor: pointer; font-size: 14px; padding: 4px; }
    .action-btn.delete:hover { opacity: 0.7; }

    /* LỊCH & NHẮC HẸN CSS */
    .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .calendar-header button { background: var(--border); border: none; color: #fff; padding: 5px 10px; border-radius: 4px; cursor: pointer; }
    .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; text-align: center; font-size: 13px; }
    .calendar-grid div { padding: 8px 0; border-radius: 4px; }
    .calendar-grid .day-name { font-weight: bold; color: var(--text-muted); }
    .calendar-grid .day-cell { background: rgba(255,255,255,0.02); position: relative; min-height: 34px; display: flex; align-items: center; justify-content: center; }
    .calendar-grid .day-cell.today { border: 1px solid var(--c-thu); color: var(--c-thu); font-weight: bold; }
    .calendar-grid .day-cell.has-reminder::after { content: ''; position: absolute; bottom: 3px; width: 5px; height: 5px; background: var(--c-chi); border-radius: 50%; }
    
    .reminder-section { margin-top: 15px; border-top: 1px solid var(--border); padding-top: 10px; max-height: 150px; overflow-y: auto; }
    .reminder-item { display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.01); padding: 6px 10px; border-radius: 4px; margin-bottom: 6px; font-size: 13px; }
    .reminder-info { display: flex; flex-direction: column; }
    .reminder-date { font-size: 11px; color: var(--text-muted); }
    .reminder-del { background: none; border: none; cursor: pointer; }

    .btn-add-reminder { background: var(--c-dautu); border: none; color: white; padding: 4px 10px; border-radius: 4px; font-size: 12px; cursor: pointer; }

    @media(max-width: 768px) {
      .row-charts { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="card">
      <h2>💸 Thêm Giao Dịch Mới</h2>
      <form id="addForm" class="form-group">
        <input type="number" id="f_amount" placeholder="Số tiền (VNĐ)" required />
        <select id="f_type">
          <option value="CHI">🔴 Chi Tiêu</option>
          <option value="THU">🟢 Thu Nhập</option>
          <option value="DAUTU">🔵 Đầu Tư</option>
        </select>
        <input type="text" id="f_category" placeholder="Danh mục (VD: Ăn uống, Lương...)" required />
        <input type="text" id="f_note" placeholder="Ghi chú thêm..." />
        <button type="submit">Thêm Giao Dịch</button>
      </form>
    </div>

    <div class="row-charts">
      <div class="card">
        <h2>📊 Cơ Cấu Chi Tiêu</h2>
        <div style="position: relative; height: 260px;">
          <canvas id="doughnutChart"></canvas>
        </div>
      </div>

      <div class="card">
        <h2>
          <span>📅 Lịch & Nhắc Hẹn</span>
          <button class="btn-add-reminder" onclick="addReminderPrompt()">+ Thêm lịch hẹn</button>
        </h2>
        <div class="calendar-header">
          <button id="prevMonth">&lt;</button>
          <span id="calendarTitle" style="font-weight: bold; font-size: 14px;">Tháng / Năm</span>
          <button id="nextMonth">&gt;</button>
        </div>
        <div class="calendar-grid" id="calendarDays">
          <div class="day-name">CN</div><div class="day-name">T2</div><div class="day-name">T3</div>
          <div class="day-name">T4</div><div class="day-name">T5</div><div class="day-name">T6</div><div class="day-name">T7</div>
          </div>

        <div class="reminder-list" id="reminderList">
          </div>
      </div>
    </div>

    <div class="row-data">
      <div class="card">
        <h2>📝 Nhật Ký Giao Dịch</h2>
        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th>Loại</th>
                <th>Ghi chú</th>
                <th>Danh mục</th>
                <th>Nguồn</th>
                <th>Số tiền</th>
                <th>Thời gian</th>
                <th>Thao tác</th>
              </tr>
            </thead>
            <tbody id="table-body">
              </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
